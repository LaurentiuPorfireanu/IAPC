server.port=8080
spring.application.name=api-gateway

## Securitate JWT (injectate din .env)
#spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:}
#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:}
spring.config.import=optional:file:.env[.properties]
app.security.jwt.secret=${JWT_SECRET_KEY:default-dev-secret-key-minimum-32-bytes-long}

spring.main.web-application-type=reactive

# Dynamic Routing (Spring Cloud 2025.1.x WebFlux)
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Rute standardizate (rutare interna exclusiv prin numele din Eureka)
spring.cloud.gateway.server.webflux.routes[0].id=ingestion-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ingestion-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/ingest/**

spring.cloud.gateway.server.webflux.routes[1].id=retrieval-pre-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://retrieval-pre
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/retrieve/pre/**

spring.cloud.gateway.server.webflux.routes[2].id=retrieval-post-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://retrieval-post
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/retrieve/post/**

# Conectare la Eureka Server
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info
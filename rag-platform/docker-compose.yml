name: rag-platform

services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    build:
      context: .
      args:
        MODULE: eureka-server
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 15s

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy

  ingest-static:
    build:
      context: .
      args:
        MODULE: ingest-static
    environment:
      SPRING_AI_VECTORSTORE_PGVECTOR_INITIALIZE_SCHEMA: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s

  ingest-dynamic:
    build:
      context: .
      args:
        MODULE: ingest-dynamic
    depends_on:
      ingest-static:
        condition: service_healthy

  retrieval-pre:
    build:
      context: .
      args:
        MODULE: retrieval-pre
    depends_on:
      ingest-static:
        condition: service_healthy

  retrieval-post:
    build:
      context: .
      args:
        MODULE: retrieval-post
    depends_on:
      ingest-static:
        condition: service_healthy
spring.application.name=ingest-dynamic
server.port=${SERVER_PORT:8082}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Eureka Discovery
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ragdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

# Ollama Models
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:llama3.2:1b}
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:latest}

# PgVector Store (must stay false here)
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=${EMBEDDING_DIMENSIONS:768}
spring.ai.vectorstore.pgvector.initialize-schema=${SPRING_AI_VECTORSTORE_PGVECTOR_INITIALIZE_SCHEMA:false}

# Dynamic Ingestion Settings
app.ingest.chunk-size=${APP_CHUNK_SIZE:800}
app.ingest.min-chunk-size-chars=350
app.ingest.fetch-timeout-ms=10000
app.ingest.block-private-networks=${APP_INGEST_BLOCK_PRIVATE_NETWORKS:true}
app.ingest.boilerplate-selectors=nav, footer, header, aside, script, style, noscript, iframe, .cookie-banner, #cookie-banner, .cookie-consent, .advertisement

# Logging
logging.level.com.example.rag.ingest_dynamic=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n


spring.threads.virtual.enabled=true
app.ingest.vector-table-name=vector_store
spring.application.name=retrieval-pre
server.port=${SERVER_PORT:8083}
spring.threads.virtual.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Eureka Discovery (internal communication strictly via Eureka service names)
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# PostgreSQL (read-only schema consumer; ingest-static owns schema initialization)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ragdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rag}
spring.datasource.password=${POSTGRES_PASSWORD:}

# Spring AI Provider & PgVector Store
spring.ai.openai.api-key=${LLM_API_KEY:}
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=${EMBEDDING_DIMENSIONS:1536}
spring.ai.vectorstore.pgvector.initialize-schema=false

# Pre-Retrieval Safe Metadata Filtering (Domain-Agnostic Whitelist)
app.filter.default-top-k=${APP_RETRIEVAL_DEFAULT_TOP_K:5}
app.filter.max-top-k=${APP_RETRIEVAL_MAX_TOP_K:50}
app.filter.max-conditions=${APP_FILTER_MAX_CONDITIONS:20}
app.filter.max-value-length=${APP_FILTER_MAX_VALUE_LENGTH:256}

app.filter.allowed-fields[doc_id]=STRING
app.filter.allowed-fields[version]=STRING
app.filter.allowed-fields[source]=STRING
app.filter.allowed-fields[source_url]=STRING
app.filter.allowed-fields[source_type]=STRING
app.filter.allowed-fields[page]=INTEGER
app.filter.allowed-fields[chunk_index]=INTEGER
app.filter.allowed-fields[checksum]=STRING
app.filter.allowed-fields[is_latest]=BOOLEAN
app.filter.allowed-fields[valid_from]=STRING
app.filter.allowed-fields[fetch_date]=STRING
app.filter.allowed-fields[org_unit]=STRING
app.filter.allowed-fields[organization_unit]=STRING
app.filter.allowed-fields[security_clearance]=STRING

app.filter.allowed-operators=eq,ne,gt,gte,lt,lte,in

# Logging
logging.level.com.example.rag.retrieval_pre=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
